<!doctype html>
<!--
  ATS-safe resume template.

  Rules this file obeys, deliberately:
    - one column, normal document flow, no tables, no images, no absolute positioning
    - no text in headers or footers (parsers strip those)
    - standard section names in the DOM, in reading order
    - real text only; nothing that depends on a font ligature surviving extraction

  Filled by render.py from a job's resume.json.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>__NAME__ — Resume</title>
<style>
  @page { size: letter; margin: 0.42in 0.5in; }

  html { -webkit-print-color-adjust: exact; }

  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: __FONTPT__pt;
    line-height: 1.21;
    color: #000;
    margin: 0;
    /* Georgia has no f-ligatures to lose, unlike the LaTeX defaults that turn
       "workflows" into "workows" when a scanner extracts the text. */
    font-variant-ligatures: none;
  }

  h1 {
    font-size: 17pt;
    letter-spacing: 0.06em;
    margin: 0 0 1pt;
    text-align: center;
    font-weight: 700;
  }

  .contact {
    text-align: center;
    font-size: 9.2pt;
    margin: 0 0 6pt;
  }

  h2 {
    font-size: 10.2pt;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    border-bottom: 0.9pt solid #000;
    margin: 6.5pt 0 3pt;
    padding-bottom: 0.5pt;
    font-weight: 700;
  }

  .entry { margin-bottom: 4pt; }

  .entry-head,
  .entry-sub {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12pt;
  }

  .org   { font-weight: 700; }
  .role  { font-style: italic; }
  .when,
  .where { white-space: nowrap; font-size: 9.6pt; }

  ul {
    margin: 1pt 0 0;
    padding-left: 12pt;
    list-style-type: disc;
  }

  li { margin-bottom: 0.8pt; }

  .line { margin: 1pt 0; }
  .label { font-weight: 700; }

  a { color: #000; text-decoration: none; }
</style>
</head>
<body>

<h1>__NAME__</h1>
<div class="contact">__CONTACT__</div>

__SECTIONS__

</body>
</html>
