# Master record of everything the candidate has done. Copy to masterdoc.yaml (gitignored) and fill in.
#
# facts   = atomic, verifiable, phrasing-free. The truth. Never written on a resume verbatim.
# bullets = phrasings OF facts. approved:true means the candidate signed off — reuse verbatim.
#           rejected:true means they killed it — never regenerate.
#
# Every bullet cites source_facts. The tailor-resume skill labels anything it writes beyond the
# facts as inferred/stretch so the candidate can prune. Run validate_masterdoc.py after editing:
# a duplicated YAML key silently deletes data, and the validator is what catches it.

