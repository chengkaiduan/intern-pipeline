        Jane Street, Citadel, Two Sigma, Hudson River Trading, Palantir, Airbnb, Uber, Waymo, SpaceX, Tesla,
        Snowflake, Figma, Notion, Ramp, Scale AI, Roblox, Coinbase, Robinhood, DoorDash, Lyft, Pinterest,
